spring.application.name=bistro-financeiro-api
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.address=${API_HOST:127.0.0.1}
server.port=${PORT:${API_PORT:3001}}
server.max-http-request-header-size=16KB
app.database-url=${DATABASE_URL:}
app.database-username=${DATABASE_USERNAME:}
app.database-password=${DATABASE_PASSWORD:}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.auth-cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jackson.deserialization.fail-on-unknown-properties=false
app.auth-cookie-secure=${AUTH_COOKIE_SECURE:false}
